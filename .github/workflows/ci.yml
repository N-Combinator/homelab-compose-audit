name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test
        # The audit is offline by design: the fixtures under tests/fixtures are
        # plain files and no docker daemon is required.
        run: pytest -v --junitxml=pytest-report.xml

      - name: Assert the suite actually ran
        # A green run that collected zero tests, or skipped every one of them,
        # is a false positive. Fail loudly instead.
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          root = ET.parse("pytest-report.xml").getroot()
          suites = [root] if root.tag == "testsuite" else list(root)
          total = sum(int(s.get("tests", 0)) for s in suites)
          skipped = sum(int(s.get("skipped", 0)) for s in suites)
          executed = total - skipped
          print(f"collected={total} skipped={skipped} executed={executed}")
          if executed < 1:
              print("ERROR: no test actually executed", file=sys.stderr)
              sys.exit(1)
          PY

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Assert both artifacts exist
        run: |
          ls -l dist/
          test -n "$(find dist -maxdepth 1 -name '*.whl' -print -quit)" || {
            echo "ERROR: no wheel produced" >&2; exit 1; }
          test -n "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" || {
            echo "ERROR: no sdist produced" >&2; exit 1; }

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/smoke
          /tmp/smoke/bin/pip install --quiet dist/*.whl
          /tmp/smoke/bin/homelab-compose-audit --version
          # Two colliding fixtures must exit 1 and name the clash.
          set +e
          /tmp/smoke/bin/homelab-compose-audit \
            tests/fixtures/media.yml tests/fixtures/web.yml --format markdown
          code=$?
          set -e
          test "$code" -eq 1 || { echo "ERROR: expected exit 1, got $code" >&2; exit 1; }
