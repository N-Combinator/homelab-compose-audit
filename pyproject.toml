[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "homelab-compose-audit"
version = "0.1.0"
description = "Offline audit of docker-compose files for port, name, network and bind-mount collisions"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "N Combinator" }]
keywords = ["docker", "docker-compose", "homelab", "audit", "lint"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: System Administrators",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Systems Administration",
]
dependencies = ["PyYAML>=5.1"]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4", "build>=1.0"]

[project.urls]
Homepage = "https://github.com/N-Combinator/homelab-compose-audit"
Issues = "https://github.com/N-Combinator/homelab-compose-audit/issues"

[project.scripts]
homelab-compose-audit = "homelab_compose_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
